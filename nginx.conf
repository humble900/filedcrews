server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ─── Security Headers ─────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # ─── Gzip Compression ─────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml
        font/woff2;

    # ─── Fingerprinted Assets: 1 Year Immutable ───────────────
    # Vite adds content hashes to filenames in /assets/ so they
    # are safe to cache indefinitely (new deploys = new hashes).
    location /assets/ {
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # ─── Static Images: 1 Year ────────────────────────────────
    location /images/ {
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # ─── Root-level static files (favicon, og-image, webp) ────
    location ~* \.(png|ico|svg|webp|jpg|jpeg|gif|woff2|woff|ttf|webmanifest)$ {
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # ─── Service Worker: No Cache ─────────────────────────────
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    location = /registerSW.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    # ─── HTML: Revalidate Every Time ──────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # ─── AI / Bot Readable Files ──────────────────────────────
    location = /llms.txt {
        add_header Cache-Control "public, max-age=86400";
        default_type text/plain;
    }

    location = /llms-full.txt {
        add_header Cache-Control "public, max-age=86400";
        default_type text/plain;
    }

    location = /robots.txt {
        add_header Cache-Control "public, max-age=86400";
        default_type text/plain;
    }

    location = /sitemap.xml {
        add_header Cache-Control "public, max-age=86400";
        default_type application/xml;
    }
}
