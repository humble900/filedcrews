name: Quality and Security CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  enterprise-validation:
    name: Enterprise Governance Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck TypeScript
        run: npx tsc --noEmit

      - name: Lint Codebase
        run: npm run lint

      - name: Run Vitest Suite with Coverage Enforcement
        run: npm test -- --run

      - name: Build Production Assets
        run: npm run build
